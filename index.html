<title>Chicken Road</title>
<style>
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:#0B0E1A; overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0B0E1A;

<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>
<script>
"use strict";
/* =====================================================================
   CHICKEN ROAD — single-file HTML5 Canvas arcade game.
   No external assets, no libraries, no network. All art drawn
   programmatically; all SFX synthesized via Web Audio API.
   ===================================================================== */

/* ---------------------------------------------------------------------
   0. Core constants (virtual/logical resolution — DESIGN.md §1.1)
   --------------------------------------------------------------------- */
const TILE   = 48;               // logical px per tile (16px art * 3x)
const COLS   = 7;                // play column width in tiles
const VW     = COLS * TILE;      // 336 virtual width
const VH     = 576;              // virtual height (12 tiles)
const HUD_H  = 48;               // top HUD strip
const WORLD_W = COLS * TILE;     // horizontal world span for entities
const ANCHOR = 415;             // screen-y where camera.y row line sits
const LEAD   = 2;                // rows player stays ahead of anchor
const HOP_DUR = 0.15;           // seconds per hop
const HOP_LIFT = 14;            // px arc apex
const STAGE_ROWS = 30;          // rows per stage before clear
/* BUG-7 fix (river landing too tight): player always lands snapped to a
   tile's exact column-center while logs/pads drift continuously, so the
   "am I on the log?" check needs the same kind of forgiveness margin
   Vehicle.hits() already applies to the *death* check (w/2 + 12) — matched
   here (and rounded up slightly, since a missed landing is unforgivingly
   fatal and should give the player the benefit of the doubt). */
const LOG_LANDING_MARGIN = 14;

/* Game states */
const S = { TITLE:'title', PLAYING:'playing', DYING:'dying', EAGLE:'eagle',
            STAGE_CLEAR:'stageclear', GAME_OVER:'gameover', VICTORY:'victory' };

/* ---------------------------------------------------------------------
   1. In-game text rendering — native bold rounded system font + soft
   rounded-join stroke outline (DESIGN.md §1.5/§1.6, REVISED M7.7/SCOPE-04).
   Replaces the old hand-drawn 5x7 bitmap FONT table/drawText() entirely.

   Size tokens (exact DESIGN §1.5 values — do not invent new px numbers):
     label  -> --fs-label  11px / 700  (HUD micro-labels: SCORE/CORN/STAGE)
     value  -> --fs-value  18px / 800  (HUD numbers, corn count)
     prompt -> --fs-prompt 13px / 700  (blinking prompts, small accents)
     body   -> --fs-body   16px / 700  (stat rows on clear/over/victory)
     title  -> --fs-title  30px / 800  (screen titles)

   NOTE (call-site deviation from uiux's handoff assumption — see this
   task's 🟠 ISSUE report): §11 assumed drawText()'s 5th arg was already a
   named "sizeToken" so call sites wouldn't need to change; the actual
   pre-M7.7 code passed a raw bitmap pixel-scale integer (1-4) instead, and
   that integer was reused inconsistently across call sites for different
   semantic sizes (e.g. scale 2 meant both --fs-body 16px stat rows AND,
   once, a title-class heading). To honor this task's harder rule ("use the
   exact px/style values uiux specified — don't invent your own"), the 5th
   arg is now the named string token per call site above (positional
   signature ctx,str,x,y,size,color,align,outline is otherwise unchanged),
   updated per-callsite against the exact DESIGN.md §7.2-§7.5 component spec
   for what that text actually is. --------------------------------------------------------------------- */
const TEXT_FONT_STACK = "ui-rounded, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif";
const TEXT_SIZE_TOKENS = {
  label:  { px:11, weight:700 },
  value:  { px:18, weight:800 },
  prompt: { px:13, weight:700 },
  body:   { px:16, weight:700 },
  title:  { px:30, weight:800 },
};
function _textFont(sizeToken){
  const t = TEXT_SIZE_TOKENS[sizeToken] || TEXT_SIZE_TOKENS.body;
  return { font: t.weight+' '+t.px+'px '+TEXT_FONT_STACK, px:t.px };
}
/* measures a string's rendered width at a given size token — used only by
   the HUD stage-badge chip to size its rounded background around the text. */
function textWidth(ctx, str, sizeToken){
  str = String(str).toUpperCase();
  const f = _textFont(sizeToken);
  ctx.save();
  ctx.font = f.font;
  ctx.letterSpacing = '0.3px'; // DESIGN §1.5: tracking relaxes to +0.3px under M7.7
  const w = ctx.measureText(str).width;
  ctx.restore();
  return w;
}
/* draw in-game text.  align: 'left'|'center'|'right'.
   outline: 0 = fill only (used for dark text already legible on a light,
   non-busy backdrop, e.g. title-screen prompt copy), 1 or 2 = apply the
   §1.6 soft rounded-join stroke outline (both truthy values collapse to the
   one spec'd technique — the old hand-pixel-stamped 1-tier/2-tier shadow
   distinction doesn't apply to a native strokeText pass). */
function drawText(ctx, str, x, y, sizeToken, color, align, outline){
  str = String(str).toUpperCase();
  align = align || 'left';
  outline = (outline===undefined) ? 2 : outline;
  const f = _textFont(sizeToken);
  ctx.save();
  ctx.font = f.font;
  ctx.letterSpacing = '0.3px';
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  if(outline){
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.lineWidth = f.px * 0.22;
    ctx.strokeStyle = 'rgba(15,23,42,0.85)';
    ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

/* ---------------------------------------------------------------------
   1b. Chicken sprite — 16x16 pixel map (DESIGN.md §4.1, ported from
   design/style-guide.html PIXEL_MAPS). Canonical facing = right.
   --------------------------------------------------------------------- */
const CHICKEN_PAL = { O:'#1B1611', B:'#FFF3D6', S:'#E8D5A8', C:'#E8432B',
                      K:'#FFB020', E:'#1B1611', P:'#FFFFFF', W:'#E0B876', L:'#FFB020' };
const CHICKEN_ROWS = [
  "................",
  "...........CC...",
  "..........OCCO..",
  ".........OCCCCO.",
  "........OBBBBPBO",
  "........OBBBEBKK",
  ".......OBBBBBBKK",
  ".....OBBBBBBBB..",
  "..OBWWWWWBBBBBO.",
  "..OBWWWWWBBBBBO.",
  "..OBBBBBBBBBBBO.",
  "...OBBBBBBBBBO..",
  "....OSSSSSSSO...",
  ".....OSSSSSO....",
  ".....LL..LL.....",
  ".....OO..OO....."
];
/* draws chicken in 16x16 sprite space; headDy bobs the head rows (0-6),
   wingOut adds flared wing pixels for the mid-hop flap pose. */
function drawChickenSprite(ctx, headDy, wingOut){
  headDy = headDy||0;
  for(let y=0;y<16;y++){
    const row = CHICKEN_ROWS[y];
    const dy = (y<=6) ? headDy : 0;
    for(let x=0;x<16;x++){
      const ch = row[x];
      if(ch==='.') continue;
      ctx.fillStyle = CHICKEN_PAL[ch];
      ctx.fillRect(x, y+dy, 1, 1);
    }
  }
  if(wingOut){
    ctx.fillStyle = '#1B1611';
    ctx.fillRect(1,7,3,3); ctx.fillRect(12,7,3,3);
    ctx.fillStyle = '#E0B876';
    ctx.fillRect(1,7,2,2); ctx.fillRect(13,7,2,2);
  }
}

/* grid helpers ------------------------------------------------------- */
function colCenterX(c){ return c*TILE + TILE/2; }
function colOf(x){ return Math.max(0, Math.min(COLS-1, Math.round(x/TILE - 0.5))); }

/* ---------------------------------------------------------------------
   1b-ii. Generated asset registry + fallback-first render helpers
   (Milestone M7.4, PLAN.md §7 / ASSET_MANIFEST.md / DESIGN.md §10.6).

   GENERATED_ASSETS is an id -> base64 `data:image/png;...` URI map, produced
   authoring-time-only by `scripts/embed-assets.js` from the uiux-curated
   registry (docs/DESIGN.md §10.6.11) — NEVER a runtime fetch. Every id below
   is one of the 30 ACCEPT/ACCEPT-WITH-NOTE assets; ids the registry rejected
   (3 tiles + veh-s2-truck) are simply absent, so `getAsset()` returns null
   for them and callers fall through to the existing programmatic draw with
   zero extra branching (PLAN §7.2 Constraint 5 — fallback-first, never a
   replacement of the old code).

   Per-layer image smoothing (explicit per orchestrator M7.4 dispatch, not a
   blanket global flip): the generated world-art raster (Option B, smooth/
   illustrated per DESIGN.md §0/§10.5) is drawn with imageSmoothingEnabled
   TRUE so it renders as intended smooth illustration, not forced-blocky
   nearest-neighbor. The HUD/chrome/particle layer (still hard-edge per
   DESIGN.md §1.3/1.4/1.6/§5, pending the separate M7.7 chrome restyle) is
   untouched and keeps imageSmoothingEnabled FALSE exactly as today — see
   Game._resize()/render() which still force it false as the resting state.
   Every generated-image draw call below is self-contained: it flips
   smoothing on immediately before its own drawImage/pattern-fill and flips
   it back off immediately after, so no other draw call (HUD text, particles,
   vector fills — none of which are affected by this flag anyway) is ever
   touched by the world-art layer's smoothing state. */

const ASSET_IMAGES = {};
function preloadGeneratedAssets(){
  for(const id in GENERATED_ASSETS){
    const img = new Image();
    img.decoding = 'async';
    const entry = { img, ready:false };
    ASSET_IMAGES[id] = entry;
    img.onload = ()=>{ entry.ready = true; };
    img.onerror = ()=>{ entry.ready = false; }; // decode/parse failure: stays absent, caller falls back
    img.src = GENERATED_ASSETS[id];
  }
}
/* returns the decoded Image only if present in the registry AND successfully
   loaded — every call-site treats a null/undefined return as "use the
   existing programmatic draw", never crashes on a missing/broken asset. */
function getAsset(id){
  const e = ASSET_IMAGES[id];
  return (e && e.ready) ? e.img : null;
}
preloadGeneratedAssets();

/* draws a generated raster with world-art smoothing scoped to just this call */
function gDrawImage(ctx, img, dx, dy, dw, dh){
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.imageSmoothingEnabled = false;
}
/* "contain" fit inside box (x,y,w,h): preserves the generated image's own
   aspect ratio (payload-ceiling sizes are not uniform, DESIGN §10.5
   Option-B framework), centered horizontally, anchored per `anchor`
   ('bottom' — default, matches standing/grounded silhouettes — or 'center'). */
function drawFitted(ctx, img, x, y, w, h, anchor){
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  if(!iw || !ih) return;
  const s = Math.min(w/iw, h/ih);
  const dw = iw*s, dh = ih*s;
  const dx = x + (w-dw)/2;
  const dy = (anchor==='center') ? y + (h-dh)/2 : y + (h-dh);
  gDrawImage(ctx, img, dx, dy, dw, dh);
}
/* seamless-tile fill for the 8 ACCEPT ground tiles (DESIGN §10.6.1 A3 #4) —
   scales the tile so it fills the lane's TILE height exactly and repeats
   horizontally across the full lane width, anchored to this draw call's own
   (x,y) so a lane's tile pattern is always internally consistent. */
function drawTiledPattern(ctx, img, x, y, w, h){
  let pat = img.__pattern;
  if(!pat){ pat = ctx.createPattern(img, 'repeat'); img.__pattern = pat; }
  if(!pat) return;
  const ih = img.naturalHeight || img.height;
  if(!ih) return;
  const scale = h / ih;
  if(pat.setTransform){
    pat.setTransform(new DOMMatrix().translate(x, y).scale(scale, scale));
  }
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = pat;
  ctx.fillRect(x, y, w, h);
  ctx.imageSmoothingEnabled = false;
}
/* shared chicken draw — used by Player, Eagle's held-chicken overlay, and the
   title-screen hero chicken. chick-idle covers idle AND both death poses
   (identical runtime transform applied by the caller, DESIGN.md §10.6.2
   decision — no separate death art needed); chick-hop covers the hop pose. */
function renderChickenSprite(ctx, hopping, headDy, wingOut){
  const img = getAsset(hopping ? 'chick-hop' : 'chick-idle');
  if(img){ drawFitted(ctx, img, -4, 0, 24, 16, 'bottom'); }
  else { drawChickenSprite(ctx, headDy, wingOut); }
}
/* per-{stage,kind} vehicle asset ids (stage is 0-indexed S1/S2/S3). null =
   no accepted asset for that cell (fallback-first, PLAN §7.3) — currently
   only veh-s2-truck (DESIGN §10.6.11: still REJECT, ground-contact-shadow
   defect not eliminated). */
const VEHICLE_ASSET_IDS = [
  { car:'veh-s1-car', truck:'veh-s1-truck', bus:null },
  { car:'veh-s2-car', truck:null,           bus:'veh-s2-bus' },
  { car:'veh-s3-car', truck:'veh-s3-truck', bus:null }
];
function vehicleAssetId(stage, kind){
  const row = VEHICLE_ASSET_IDS[stage];
  return (row && row[kind]) || null;
}
/* per-{stage,laneType} ground-tile asset id. null = one of the 3 confirmed
   tiling-fail tiles (tile-s2-road/tile-s3-road/tile-s3-rail, DESIGN §10.6.1)
   — deliberately never looked up further, existing programmatic fill stays
   wired untouched. */
function tileAssetId(type, stage){
  if(type==='grass') return stage===0?'tile-s1-grass':stage===1?'tile-s2-grass':'tile-s3-ground';
  if(type==='road')  return stage===0?'tile-s1-road':null;
  if(type==='river') return stage===0?'tile-s1-river':stage===1?'tile-s2-river':null;
  if(type==='rail')  return stage===0?'tile-s1-rail':stage===1?'tile-s2-rail':null;
  return null;
}

/* ---------------------------------------------------------------------
   1c. Particle system (DESIGN.md §5) — dust, feathers, splash, sparkle,
   expanding rings, ambient. All simple filled shapes, no images.
   --------------------------------------------------------------------- */
class Particle {
  constructor(o){
    this.x=o.x; this.y=o.y; this.vx=o.vx||0; this.vy=o.vy||0;
    this.g=o.g||0; this.size=o.size||2; this.color=o.color||'#fff';
    this.life=o.life||0.3; this.max=this.life; this.type=o.type||'rect';
    this.rot=Math.random()*Math.PI; this.vr=(Math.random()-0.5)*8;
    this.drag=o.drag||0;
  }
  update(dt){
    this.life -= dt;
    this.vy += this.g*dt;
    if(this.drag){ this.vx *= (1-this.drag*dt); this.vy *= (1-this.drag*dt); }
    this.x += this.vx*dt; this.y += this.vy*dt; this.rot += this.vr*dt;
    return this.life>0;
  }
  render(ctx){
    const a = Math.max(0, this.life/this.max);
    ctx.globalAlpha = a;
    if(this.type==='ring'){
      const r = this.size*(1 + (1-a)*2.2);
      ctx.strokeStyle = this.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI*2); ctx.stroke();
    } else if(this.type==='feather'){
      ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
      ctx.fillStyle = this.color;
      ctx.fillRect(-this.size, -1, this.size*2, 2);
      ctx.restore();
    } else if(this.type==='spark'){
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x-this.size, this.y, this.size*2, 1);
      ctx.fillRect(this.x, this.y-this.size, 1, this.size*2);
    } else {
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x|0, this.y|0, this.size, this.size);
    }
    ctx.globalAlpha = 1;
  }
}
class ParticleSystem {
  constructor(){ this.list = []; }
  clear(){ this.list.length = 0; }
  add(o){ this.list.push(new Particle(o)); }
  update(dt){
    for(let i=this.list.length-1;i>=0;i--){
      if(!this.list[i].update(dt)) this.list.splice(i,1);
    }
  }
  render(ctx){ for(const p of this.list) p.render(ctx); }

  dust(x,y,tint){
    const col = tint || '#C9BFA6';
    const n = 3 + (Math.random()*3|0);
    for(let i=0;i<n;i++){
      const a = (i/n)*Math.PI*2 + Math.random();
      this.add({x,y, vx:Math.cos(a)*30, vy:Math.sin(a)*18 - 24,
        g:20, size:2+(Math.random()*2|0), color:col, life:0.25+Math.random()*0.08});
    }
  }
  feathers(x,y){
    const cols = ['#FFF3D6','#E8D5A8','#E0B876'];
    for(let i=0;i<9;i++){
      const a = (i/9)*Math.PI*2 + Math.random()*0.4;
      const sp = 60+Math.random()*80;
      this.add({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 40,
        g:220, size:2+(Math.random()*2|0), color:cols[i%3], life:0.5+Math.random()*0.2, type:'feather'});
    }
  }
  splash(x,y,foam,water){
    for(let i=0;i<11;i++){
      const a = (i/11)*Math.PI*2;
      const sp = 50+Math.random()*70;
      this.add({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60,
        g:260, size:2, color:(i%2?foam:water), life:0.4+Math.random()*0.2});
    }
    this.add({x,y, size:6, color:foam, life:0.5, type:'ring'});
  }
  sparkle(x,y){
    for(let i=0;i<6;i++){
      const a = (i/6)*Math.PI*2;
      this.add({x,y, vx:Math.cos(a)*40, vy:Math.sin(a)*40,
        size:2, color:(i%2?'#FFD23F':'#FFFFFF'), life:0.28+Math.random()*0.07, type:'spark'});
    }
  }
}

/* ---------------------------------------------------------------------
   2. Audio manager — Web Audio synthesized SFX (DESIGN.md / PRD AC-11)
   --------------------------------------------------------------------- */
/* ---------------------------------------------------------------------
   1d. Generated-audio plumbing (M7.4 I3, ENV-03 DEFERRED — scaffolding
   ONLY, no generated audio wired). GENERATED_SFX_SOURCES would hold
   id -> base64 `data:audio/...` URIs the same way GENERATED_ASSETS holds
   images; it is intentionally EMPTY today (generated SFX generation is
   deferred, docs/reports/ISSUES.md ENV-03 — the fast-follow revisit paths
   are listed there). GENERATED_SFX holds the decoded AudioBuffers once
   unlocked; since GENERATED_SFX_SOURCES is empty, that loop never
   populates anything, so every AudioManager cue below falls through to its
   existing oscillator/noise synthesis exactly as it does today — this is
   plumbing a future increment could fill in by adding entries to
   GENERATED_SFX_SOURCES, not a functional change now. --------------------------------------------------------------------- */
const GENERATED_SFX_SOURCES = {}; // id -> data:audio/...;base64,... (empty, ENV-03 deferred)
const GENERATED_SFX = {};         // id -> decoded AudioBuffer (populated at unlock if sources exist)
function dataURIToArrayBuffer(dataURI){
  const b64 = dataURI.substring(dataURI.indexOf(',')+1);
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

class AudioManager {
  constructor(){
    this.ctx = null;
    this.muted = false;
    this.unlocked = false;
    this.master = null;
    this._sfxLoaded = false;
  }
  ensure(){
    if(this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    } catch(e){ this.ctx = null; }
  }
  unlock(){
    this.ensure();
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    if(!this._sfxLoaded) this._loadGeneratedSFX();
    this.unlocked = true;
  }
  /* decodes any GENERATED_SFX_SOURCES entries into GENERATED_SFX buffers.
     No-op today (sources map is empty, ENV-03 deferred) — present so a
     future increment can populate GENERATED_SFX_SOURCES with zero other
     code change (fallback-first: a decode failure just leaves that id
     absent from GENERATED_SFX, so the synth fallback keeps working). */
  _loadGeneratedSFX(){
    this._sfxLoaded = true;
    if(!this.ctx) return;
    for(const id in GENERATED_SFX_SOURCES){
      try{
        const arr = dataURIToArrayBuffer(GENERATED_SFX_SOURCES[id]);
        this.ctx.decodeAudioData(arr,
          (decoded)=>{ GENERATED_SFX[id] = decoded; },
          ()=>{ /* decode failed: id stays absent, synth fallback stays active */ });
      } catch(e){ /* malformed source: synth fallback stays active */ }
    }
  }
  /* plays a decoded generated buffer through the existing gain/mute graph if
     one exists for `id`; returns false (no-op) otherwise so the caller can
     fall back to its oscillator/noise synthesis unchanged. */
  playGenerated(id){
    if(!this.ctx || this.muted) return false;
    const buf = GENERATED_SFX[id];
    if(!buf) return false;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = 1;
    src.connect(g); g.connect(this.master);
    src.start();
    return true;
  }
  toggleMute(){ this.muted = !this.muted; return this.muted; }
  /* generic tone with optional frequency sweep */
  tone(freq, dur, type, gain, sweepTo, delay){
    if(!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + (delay||0);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if(sweepTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1,sweepTo), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain||0.3, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  noise(dur, gain, filterFreq){
    if(!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = gain||0.3;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = filterFreq||1200;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0);
  }
  /* each cue checks GENERATED_SFX first (M7.4 I3 plumbing — always empty
     today, ENV-03 deferred), else synthesizes exactly as before. */
  hop(){ if(this.playGenerated('hop')) return; this.tone(420, 0.09, 'square', 0.22, 720); }
  corn(){ if(this.playGenerated('corn')) return; this.tone(880,0.08,'sine',0.28); this.tone(1320,0.10,'sine',0.24,null,0.06); }
  horn(){ if(this.playGenerated('horn')) return; this.tone(180,0.22,'sawtooth',0.16,170); }
  bell(){ if(this.playGenerated('bell')) return; this.tone(1400,0.08,'triangle',0.20); this.tone(1860,0.10,'triangle',0.14,null,0.02); }
  death(){ if(this.playGenerated('death')) return; this.tone(600,0.18,'square',0.28,120); this.noise(0.25,0.22,900); this.tone(300,0.3,'sawtooth',0.14,90,0.05); }
  splash(){ if(this.playGenerated('splash')) return; this.noise(0.3,0.28,2200); this.tone(500,0.2,'sine',0.14,120); }
  clear(){ if(this.playGenerated('clear')) return; [523,659,784,1046].forEach((f,i)=> this.tone(f,0.16,'square',0.22,null,i*0.09)); }
  gameover(){ if(this.playGenerated('gameover')) return; [392,330,262].forEach((f,i)=> this.tone(f,0.28,'square',0.2,null,i*0.14)); }
}

/* ---------------------------------------------------------------------
   3. Input manager — keyboard + touch/swipe (PRD AC-2 / AC-13)
   --------------------------------------------------------------------- */
class InputManager {
  constructor(canvas, game){
    this.game = game;
    this.canvas = canvas;
    this._bindKeys();
    this._bindTouch();
  }
  _bindKeys(){
    window.addEventListener('keydown', (e)=>{
      const k = e.key.toLowerCase();
      const arrows = ['arrowup','arrowdown','arrowleft','arrowright',' '];
      if(arrows.includes(k)) e.preventDefault();
      this.game.onFirstInput();
      if(k==='arrowup'||k==='w') this.game.input('up');
      else if(k==='arrowdown'||k==='s') this.game.input('down');
      else if(k==='arrowleft'||k==='a') this.game.input('left');
      else if(k==='arrowright'||k==='d') this.game.input('right');
      else if(k===' '||k==='enter') this.game.input('confirm');
      else if(k==='m') this.game.toggleMute();
    }, {passive:false});
  }
  _bindTouch(){
    let sx=0, sy=0, active=false, moved=false;
    const start = (x,y)=>{
      this.game.onFirstInput();
      if(this.game.hitMute(x,y)){ active=false; return; }   // mute button swallows input
      sx=x; sy=y; active=true; moved=false;
    };
    const end = (x,y)=>{
      if(!active) return; active=false;
      const dx=x-sx, dy=y-sy;
      const adx=Math.abs(dx), ady=Math.abs(dy);
      this.game.onFirstInput();
      if(adx<24 && ady<24){ this.game.input('tap'); return; }
      if(adx>ady) this.game.input(dx>0?'right':'left');
      else this.game.input(dy>0?'down':'up');
    };
    this.canvas.addEventListener('pointerdown', (e)=>{ start(e.clientX,e.clientY); }, {passive:true});
    this.canvas.addEventListener('pointerup',   (e)=>{ end(e.clientX,e.clientY); }, {passive:true});
    this.canvas.addEventListener('pointercancel',()=>{ active=false; }, {passive:true});
    // block context menu / gestures
    this.canvas.addEventListener('contextmenu', e=>e.preventDefault());
  }
}
